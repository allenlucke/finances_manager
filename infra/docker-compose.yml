name: finances-manager

# Every service restarts unless stopped by hand. D-16 puts this on an always-on box; without a
# policy a power blip left the stack down until someone SSHed in. Note `make e2e` reuses this
# file as a second project, and `make e2e-down` is what stops those from restarting too.
x-restart: &restart
  restart: unless-stopped

# Bounded logs. json-file grows without limit by default, on a box that is meant to run for years.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: [*restart, *logging]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-finances}
      POSTGRES_USER: ${DATABASE_USER:-finances}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-finances}
    # The database port is deliberately NOT published. Only the api container needs it, and it
    # reaches it over the compose network by service name. Publishing it put PostgreSQL on every
    # interface — reachable by anything on the same wifi — behind the password that ships in
    # .env.example. Use `docker compose exec db psql -U finances -d finances` for a shell.
    volumes:
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data. Postgres 18's image stores
      # data in a major-version subdirectory so pg_upgrade can work across a single mount; the old
      # /data path makes it refuse to start. This matters beyond startup — a volume on the wrong
      # path would back up an empty directory (D-16 requires a tested restore before real data).
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-finances} -d ${DATABASE_NAME:-finances}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    <<: [*restart, *logging]
    build:
      context: ../services/ai
    # A stateless parser of untrusted files. It writes nothing, so it gets nothing to write to,
    # and it runs with no capabilities it could escalate through. The image also drops root.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Keys the one-way account ids the importer links rows by (docs/SECURITY.md). Required, and
      # compose refuses to start the service without it rather than let the parser fall back to a
      # bare hash of the account number. `make up` generates one into .env; infra/e2e.env carries a
      # throwaway for the scratch stack. Back it up with the database: without it, every linked
      # account has to be re-linked by its last four on its next import.
      ACCOUNT_KEY_SECRET: ${ACCOUNT_KEY_SECRET:?ACCOUNT_KEY_SECRET is not set - run `make up`, which generates it into .env}
    # Not published to the host by default: the AI service is internal-only.
    # Uncomment for local debugging, and see docs/SECURITY.md before exposing it anywhere else.
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: [*restart, *logging]
    build:
      context: ../services/api
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-finances}
      DATABASE_USER: ${DATABASE_USER:-finances}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-finances}
      AI_SERVICE_URL: http://ai:8000
      # Honoured by the API since 2026-08-29; before that only `ai` read it and the API shipped at
      # DEBUG, which put rejected statement bodies in the log.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Passkeys are bound to the browser's origin. These default to the dev ports and MUST be
      # overridden anywhere else — the e2e stack (infra/e2e.env) and the Tailscale host (D-16).
      # They were not passed through at all before, which made the "override there" instruction
      # in application.yml impossible to follow from .env.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Local automation token (D-17). Empty by default, which disables the feature outright.
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN:-}
      # Off in Docker, and this is not a weakening — it is the check admitting it cannot work here.
      # Docker NATs published traffic, so a request the host sent to 127.0.0.1:8080 reaches the API
      # with the bridge gateway as its source address. The in-process check sees a routable address
      # and refuses a caller that genuinely is on this machine.
      #
      # What actually bounds reachability is the port publishing below: `127.0.0.1:8080:8080` means
      # nothing off this host can open the connection in the first place. That is the same boundary
      # the whole app already relies on, not a new one taken on for this feature. Running the API
      # natively (`make api`) keeps the in-process check, which is why it stays the default.
      LOCAL_API_TOKEN_LOOPBACK_ONLY: ${LOCAL_API_TOKEN_LOOPBACK_ONLY:-false}
    ports:
      # BIND_ADDR defaults to loopback. Docker's default is 0.0.0.0, which publishes to the whole
      # local network — not what "running it locally" implies, and wrong for a service holding
      # financial data. On the homelab (D-16) set BIND_ADDR to the box's Tailscale address, and
      # read the note on LOCAL_API_TOKEN below before you do: this line is the only thing keeping
      # that token off the network.
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: [*restart, *logging]
    build:
      context: ../services/web
    # Only start serving once the API is actually healthy. nginx serves the SPA the instant it
    # starts, and with the short-form depends_on it did so while the API was still running
    # migrations — the flake reset-database.ts had to work around with a 60-second poll.
    depends_on:
      api:
        condition: service_healthy
    ports:
      # nginx-unprivileged listens on 8080; see services/web/Dockerfile.
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-4200}:8080"
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to ::1 first and nginx
      # listens on IPv4 only, so the check was refused every time and the container sat at
      # "unhealthy" for its whole life while serving perfectly. Nothing waits on this service's
      # health, which is the only reason it went unnoticed.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
