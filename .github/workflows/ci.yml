name: CI

on:
  push:
    branches: [main, modernize-2026]
  pull_request:

# Nothing in this repo should ever need write permissions to run tests.
permissions:
  contents: read

# Actions are referenced by major tag rather than commit SHA. That is a mutable reference and a
# real supply-chain surface; it is accepted here because this workflow has read-only permissions,
# handles no secrets, and runs on a public repo with no deploy step. Pin by SHA before either of
# those changes.

# A newer push to the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Test
        working-directory: services/api
        # The wrapper, not whatever Maven the runner has: D-10 pins 3.9.16 and the Makefile uses
        # the same, so CI and a laptop build with one version.
        run: ./mvnw -B --no-transfer-progress test

  web:
    name: Web (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install
        working-directory: services/web
        run: npm ci
      - name: Test
        working-directory: services/web
        run: npm run test:ci
      - name: Build
        working-directory: services/web
        run: npm run build

  ai:
    name: AI (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        working-directory: services/ai
        run: uv sync --extra dev
      - name: Lint
        working-directory: services/ai
        run: uv run ruff check src tests
      - name: Test
        working-directory: services/ai
        run: uv run pytest -q

  mcp:
    name: MCP (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        working-directory: services/mcp
        run: uv sync
      - name: Lint
        working-directory: services/mcp
        run: uv run ruff check src tests
      - name: Test
        working-directory: services/mcp
        run: uv run pytest -q

  # The images are what actually run. Twice a change compiled locally and failed in the image —
  # once for a tool that was not on the image's PATH, once because Maven's incremental build had
  # skipped recompiling tests. Building here catches both.
  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build every image
        # ensure-env, not a bare copy: compose refuses to start without ACCOUNT_KEY_SECRET, which
        # the example leaves blank on purpose and the Makefile generates.
        run: |
          make ensure-env
          docker compose -f infra/docker-compose.yml --env-file .env build

  # The browser suite, against the same images, on the isolated compose project.
  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install
        working-directory: services/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run
        run: make e2e
      - name: Tear down
        if: always()
        run: make e2e-down
      # Traces are screenshots of a finance app. Failures only, and not for long.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: services/web/playwright-report
          retention-days: 3
