spring:
  application:
    name: finances-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finances}
    username: ${DATABASE_USER:finances}
    password: ${DATABASE_PASSWORD:finances}
  jpa:
    # Flyway owns the schema. Hibernate never modifies it. Do not change this to 'update'.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

finances:
  version: 0.1.0-SNAPSHOT
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout: 30s

logging:
  level:
    llc.feelingfroggy.finances: DEBUG
