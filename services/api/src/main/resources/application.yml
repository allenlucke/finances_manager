spring:
  application:
    name: finances-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finances}
    username: ${DATABASE_USER:finances}
    password: ${DATABASE_PASSWORD:finances}
  jpa:
    # Flyway owns the schema. Hibernate never modifies it. Do not change this to 'update'.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  session:
    # Sessions live in Postgres, not Tomcat memory (D-12: revocation, and surviving a restart).
    store-type: jdbc
    # This is an INACTIVITY timeout (Spring Session's maxInactiveInterval), not an absolute one:
    # a session that keeps being used keeps living. Fourteen days idle is generous for a tool used
    # a few times a week and short enough that a forgotten laptop is not signed in all quarter.
    timeout: 14d
    jdbc:
      # Flyway owns the schema. Spring Session must never create its own tables.
      initialize-schema: never

server:
  port: ${API_PORT:8080}
  servlet:
    session:
      cookie:
        # D-12 specifies all three. HttpOnly and SameSite cost nothing anywhere. Secure is off by
        # default because the dev stack and the Tailscale deployment both serve plain HTTP, and a
        # Secure cookie over HTTP is a cookie the browser never sends — nobody could sign in. Set
        # COOKIE_SECURE=true the day this sits behind TLS.
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

spring.servlet.multipart:
  # Statements are small; a real Chase year is well under a megabyte. Bounded so an oversized
  # upload is refused by the container before it reaches the parser.
  max-file-size: 10MB
  max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

finances:
  version: 0.1.0-SNAPSHOT
  # The zone "today" is decided in wherever the API decides it itself. Containers run in UTC, and
  # a Kansas evening on the 31st is already next month there.
  zone: ${APP_TIMEZONE:America/Chicago}
  security:
    webauthn:
      # rpId must equal the browser's registrable domain, and allowed-origins must be full origins.
      # Both change when this moves to the Tailscale host (D-16) — override there, do not hardcode.
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      rp-name: ${WEBAUTHN_RP_NAME:Finances Manager}
      allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  # Local automation token (D-17), used by services/mcp so Claude Code can drive the API without a
  # browser session. Blank disables it entirely, and blank is the default: the bypass does not
  # exist until one is deliberately set. Read docs/SECURITY.md before setting it anywhere but here.
  local-token:
    value: ${LOCAL_API_TOKEN:}
    loopback-only: ${LOCAL_API_TOKEN_LOOPBACK_ONLY:true}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout: 30s
  # Watching the market (M7a, D-18). The poller is off here and on in compose; tests never run it.
  market:
    scheduled: ${MARKET_REFRESH_SCHEDULED:false}
    refresh-every: ${MARKET_REFRESH_EVERY:PT5M}
    ntfy-url: ${NTFY_URL:}
  # Order execution (M7b, D-18). Off by default everywhere; a confirmed paper order is refused with
  # a sentence naming the switch. The cap bounds a day's confirmed paper orders in dollars.
  trading:
    enabled: ${TRADING_ENABLED:false}
    daily-notional-cap: ${TRADING_DAILY_CAP:1000.00}

logging:
  level:
    # INFO by default, not DEBUG. AiServiceClient logs a rejected upload's body at DEBUG on the
    # stated grounds that docs/SECURITY.md keeps statement content out of INFO — a mitigation that
    # a package-level DEBUG default cancelled out entirely. Set LOG_LEVEL=DEBUG deliberately.
    llc.feelingfroggy.finances: ${LOG_LEVEL:INFO}
