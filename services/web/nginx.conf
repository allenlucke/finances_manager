server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Statement uploads. The API accepts 10 MB (spring.servlet.multipart) and nginx's default is
    # 1 MB, so a two-megabyte Fidelity history was answered with a nginx 413 HTML page in Docker
    # while working under the dev server. Matches the API's max-request-size.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Spring Security's WebAuthn endpoints live outside /api. Without these two blocks the
    # passkey ceremonies fell through to `try_files` below and were answered with 405 and an HTML
    # body — passkeys were silently dead in the only stack that runs on the homelab, while the dev
    # server's proxy.conf.json handled them, which is why nobody noticed. `=` on the login path so
    # the SPA's own /login route keeps rendering.
    location /webauthn/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /login/webauthn {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
